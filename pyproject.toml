[project]
name = "spandan-mcp-server"
version = "0.1.0"
description = "Private, stateless MCP tools for Spandan appointment operations"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.3.0",
  "httpx>=0.27.0",
  "uvicorn>=0.28.0",
  "pydantic-settings>=2.2.0",
  "pyjwt[crypto]>=2.15.0",
  "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spandan_mcp = ["contract.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
